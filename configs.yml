data:
    image_size: 64
    channels: 3
    num_workers: 0
    train_data_dir: "data/train/"
    test_data_dir: "data/test/"
    test_save_dir: "results/"
    val_save_dir: "validation/"
    grid_r: 16
    conditional: True

model:
    in_channels: 3
    out_ch: 3
    ch: 128
    ch_mult: [1, 2, 3, 4]
    num_res_blocks: 2
    attn_resolutions: [16, ]
    dropout: 0.0
    ema_rate: 0.999
    ema: True
    resamp_with_conv: True

diffusion:
    beta_schedule: linear
    beta_start: 0.0001
    beta_end: 0.02
    num_diffusion_timesteps: 1000

training:
    patch_n: 4
    batch_size: 4
    n_epochs: 50
    n_iters: 2000000
    snapshot_freq: 10000  # model save frequency
    validation_freq: 10000
    resume: 'checkpoints/diffusion_model'
    seed: 0  # random seed

sampling:
    batch_size: 4
    last_only: True
    sampling_timesteps: 25

optim:
    weight_decay: 0.000
    optimizer: "Adam"
    lr: 0.00002
    amsgrad: False
    eps: 0.00000001
